<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixing the Houston Grocery Gap</title>
    <meta name="description" content="A decision support tool for deciding where Houston should recruit new grocery stores.">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <main class="app-content">
        <aside class="rail" aria-label="controls">
            <header class="rail-header">
                <h1>Where should Houston's next grocery stores go?</h1>
            </header>

            <div class="tabs" role="tablist" aria-label="steps">
                <button class="tab" type="button">Find gaps</button>
                <button class="tab" type="button">Rank locations</button>
                <button class="tab" type="button">Test plans</button>
            </div>

            <section class="panel" role="tabpanel">
                <h2 id="definition-heading">What do we count as a grocery store?</h2>
                <fieldset class="choice" aria-labelledby="definition-heading">
                    <legend class="visually-hidden">Food access definition</legend>
                    <label class="choice-row">
                        <input type="radio" name="definition" value="grocery" checked>
                        <span class="choice-text">
                            <span class="choice-name">Grocery stores only</span>
                            <span class="choice-meta">Supermarkets, supercenters and large grocers, <span data-count="grocery">726</span> in and near the county</span>
                        </span>
                    </label>
                    <label class="choice-row">
                        <input type="radio" name="definition" value="usda">
                        <span class="choice-text">
                            <span class="choice-name">Any SNAP store</span>
                            <span class="choice-meta">Adds convenience, dollar and drug stores, <span data-count="snap">4,224</span> in all</span>
                        </span>
                    </label>
                </fieldset>

                <div class="headline" id="headline" aria-live="polite"></div>

                <p class="note" id="definition-note"></p>
            </section>

            <section class="panel" role="tabpanel" hidden>
                <h2>What is important when ranking new locations?</h2>
            </section>

            <section class="panel" role="tabpanel" hidden>
                <h2>Test a recruitment plan</h2>
            </section>

            <section class="panel" aria-labelledby="layers-heading">
                <h2>Map layers</h2>
                <ul class="layer-list">
                    <li>
                        <label class="layer-toggle">
                            <input type="checkbox" name="layer" value="grocery" checked>
                            <span class="swatch dot" data-cat="grocery"></span>
                            <span class="layer-name">Grocery stores</span>
                            <span class="layer-count" data-count="grocery"></span>
                        </label>
                    </li>
                    <li>
                        <label class="layer-toggle">
                            <input type="checkbox" name="layer" value="small">
                            <span class="swatch dot" data-cat="small"></span>
                            <span class="layer-name">Small grocers</span>
                            <span class="layer-count" data-count="small"></span>
                        </label>
                    </li>
                    <li>
                        <label class="layer-toggle">
                            <input type="checkbox" name="layer" value="dollar">
                            <span class="swatch dot" data-cat="dollar"></span>
                            <span class="layer-name">Dollar stores and pharmacies</span>
                            <span class="layer-count" data-count="dollar"></span>
                        </label>
                    </li>
                    <li>
                        <label class="layer-toggle">
                            <input type="checkbox" name="layer" value="convenience">
                            <span class="swatch dot" data-cat="convenience"></span>
                            <span class="layer-name">Convenience stores</span>
                            <span class="layer-count" data-count="convenience"></span>
                        </label>
                    </li>
                </ul>
            </section>
        </aside>
        <div class="map-wrap">
            <div id="map" class="map"></div>
            <div class="legend" id="legend" aria-hidden="true"></div>
        </div>  
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixing the Houston Grocery Gap</title>
    <meta name="description" content="A decision support tool for deciding where Houston should recruit new grocery stores.">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <main class="app-content">
        <aside class="rail" aria-label="controls">
            <header class="rail-header">
                <h1>Where should Houston's next grocery stores go?</h1>
            </header>

            <div class="tabs" role="tablist" aria-label="steps">
                <button class="tab" type="button">Find gaps</button>
                <button class="tab" type="button">Rank locations</button>
                <button class="tab" type="button">Test plans</button>
            </div>

            <section class="panel" role="tabpanel">
                <h2 id="definition-heading">What do we count as a grocery store?</h2>
            </section>

            <section class="panel" role="tabpanel" hidden>
                <h2>What is important when ranking new locations?</h2>
            </section>

            <section class="panel" role="tabpanel" hidden>
                <h2>Test a recruitment plan</h2>
            </section>
        </aside>
    </main>
    <div id="map" class="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
